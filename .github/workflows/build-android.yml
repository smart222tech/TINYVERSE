name: Build TINYVERSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android export environment
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk unzip curl
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.1" "ndk;23.2.8568313" "cmake;3.10.2.4988404"
          set -o pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -o -j /tmp/godot-templates.tpz -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "=== Godot Android editor settings ==="
          test -s "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "=== Android toolchain ==="
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"

      - name: Prepare build directory
        run: mkdir -p build

      - name: Validate and import project
        run: godot --headless --editor --path . --quit

      - name: Verify Android export preset
        run: test -f export_presets.cfg && grep -q '^name="Android"' export_presets.cfg

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: godot --headless --verbose --path . --export-debug "Android" build/TINYVERSE-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TINYVERSE-Android-debug
          path: build/TINYVERSE-debug.apk
          if-no-files-found: error
          retention-days: 14
          retention-days: 14
